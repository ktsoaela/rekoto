name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build extensions
        run: npm run build:ext

      - name: Build app bundles
        run: npm run build

  release:
    name: Windows installer
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extensions
        run: npm run build:ext

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Package browser extensions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Path extensions/chrome/* -DestinationPath release-assets/rekoto-extension-chrome.zip -Force
          Compress-Archive -Path extensions/firefox/* -DestinationPath release-assets/rekoto-extension-firefox.zip -Force
          Copy-Item dist/Rekoto-Setup.exe release-assets/Rekoto-Setup.exe -Force

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "${{ github.ref_name }}" `
            release-assets/Rekoto-Setup.exe `
            release-assets/rekoto-extension-chrome.zip `
            release-assets/rekoto-extension-firefox.zip `
            --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rekoto-windows
          path: |
            release-assets/Rekoto-Setup.exe
            release-assets/rekoto-extension-chrome.zip
            release-assets/rekoto-extension-firefox.zip
          retention-days: 30
