<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="card">
      <header class="head">
        <h1 id="heading">Record a new video</h1>
        <div class="switcher" role="tablist" aria-label="Video or screenshot">
          <button class="sw active" data-tab="rec" role="tab" title="Video" aria-label="Video">
            <svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button class="sw" data-tab="shot" role="tab" title="Screenshot" aria-label="Screenshot">
            <svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <button id="close" class="x" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <!-- ===================== Video ===================== -->
      <section id="tab-rec">
        <div id="rec-live" class="live hidden">
          <div class="live-head"><span class="rec-dot"></span><strong id="live-label">Recording</strong></div>
          <div class="two">
            <button id="pause" class="btn">Pause</button>
            <button id="stop" class="btn btn-accent">Finish and save</button>
          </div>
        </div>

        <div id="rec-setup">
          <div class="tiles three">
            <button class="tile" data-mode="screen">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" class="solid"/><path d="M9 20h6M12 16v4"/></svg>
              <span>Screen Only</span>
            </button>
            <button class="tile" data-mode="camera">
              <svg viewBox="0 0 24 24"><path d="M8 6l1.5-2h5L16 6h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" class="solid"/><circle cx="12" cy="13" r="3.2" class="hole"/></svg>
              <span>Camera</span>
            </button>
            <button class="tile selected" data-mode="both">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" class="solid"/><rect x="11.5" y="12" width="6" height="4.5" rx="1.2" class="hole"/></svg>
              <span>Screen + Camera</span>
            </button>
          </div>

          <div class="split">
            <div class="fields">
              <label class="label" for="title">Title</label>
              <input id="title" class="pill" placeholder="Untitled recording" maxlength="120" />
              <label class="label" for="target">Record</label>
              <div class="pill select" id="target-row">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18"/></svg>
                <select id="target" aria-label="What to record">
                  <option value="desktop">Entire screen</option>
                  <option value="tab">This tab</option>
                  <option value="area">Custom area of this tab</option>
                </select>
              </div>
            </div>
            <div class="preview" id="preview">
              <video id="cam-video" muted playsinline autoplay></video>
              <button id="allow-cam" class="allow hidden">
                <svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/></svg>
                Allow camera
              </button>
              <span id="cam-off" class="cam-off hidden">
                <svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3z"/><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M3 3l18 18"/></svg>
              </span>
            </div>
          </div>

          <span class="label">Hardware</span>
          <div class="pill select" id="cam-row">
            <svg viewBox="0 0 24 24"><path d="M15 10l5-3v10l-5-3z" class="solid"/><rect x="3" y="6" width="12" height="12" rx="2" class="solid"/></svg>
            <select id="cam" aria-label="Camera"></select>
          </div>
          <div class="pill select" id="mic-row">
            <svg viewBox="0 0 24 24"><rect x="8" y="2.5" width="8" height="13" rx="4" class="solid"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <select id="mic" aria-label="Microphone"></select>
          </div>

          <div class="chips">
            <label class="chip"><input type="checkbox" id="sound-on" /><span>Computer sound</span></label>
            <label class="chip"><input type="checkbox" id="bar-on" checked /><span>Control bar</span></label>
            <label class="chip sel"><select id="res" aria-label="Quality"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="1440">1440p</option></select></label>
            <label class="chip sel"><select id="fmt" aria-label="Format"><option value="mp4" selected>MP4</option><option value="webm">WebM</option></select></label>
          </div>

          <div class="wave" id="wave" aria-label="Microphone level" role="img"></div>

          <p id="rec-error" class="error hidden"></p>
          <button id="start" class="btn btn-accent btn-big">Start Recording</button>
        </div>
      </section>

      <!-- ===================== Screenshot ===================== -->
      <section id="tab-shot" class="hidden">
        <div class="tiles three">
          <button class="tile selected" data-shot="visible" title="Alt+Shift+V">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5" class="solid"/><path d="M3 9.5h18" class="cut"/></svg>
            <span>Visible part</span>
          </button>
          <button class="tile" data-shot="full" title="Alt+Shift+F">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2.5" class="solid"/><path d="M8.5 7h7M8.5 11h7M8.5 15h4.5" class="cut"/></svg>
            <span>Full page</span>
          </button>
          <button class="tile" data-shot="area" title="Alt+Shift+A">
            <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1.5" class="solid"/></svg>
            <span>Selected area</span>
          </button>
          <button class="tile" data-shot="desktop">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" class="solid"/><path d="M9 20h6M12 16v4"/></svg>
            <span>Entire screen</span>
          </button>
          <button class="tile" data-shot="annotate">
            <svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z" class="solid"/></svg>
            <span>Annotate image</span>
          </button>
          <button class="tile" data-shot="ocr">
            <svg viewBox="0 0 24 24"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 9h8M12 9v7"/></svg>
            <span>Extract text</span>
          </button>
        </div>

        <div class="two">
          <div>
            <label class="label" for="delay">Delay</label>
            <div class="pill select" id="delay-row">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
              <select id="delay">
                <option value="0">No delay</option>
                <option value="3">3 seconds</option>
                <option value="5">5 seconds</option>
                <option value="10">10 seconds</option>
              </select>
            </div>
          </div>
          <div>
            <label class="label" for="shot-save">Save to</label>
            <div class="pill select">
              <svg viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/></svg>
              <select id="shot-save">
                <option value="pc">Pictures</option>
                <option value="downloads">Downloads</option>
              </select>
            </div>
          </div>
        </div>

        <p class="note" id="shot-note"></p>
        <p id="shot-error" class="error hidden"></p>
        <button id="shoot" class="btn btn-accent btn-big">Take Screenshot</button>
      </section>

      <footer class="foot">
        <span id="status" class="status">Connecting…</span>
        <label class="mask"><input type="checkbox" id="alwaysMask" role="switch" /><span class="toggle" aria-hidden="true"></span>Always mask passwords</label>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
