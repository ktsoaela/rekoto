<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><span class="logo"></span> Loom Clone</header>
    <div id="status" class="status">Connecting…</div>
    <div id="idle" class="hidden">
      <button id="start" class="primary"><span class="dot"></span> Record this window</button>
      <p class="hint">Records this browser window with your camera and mic settings from the app. Bookmarks and the address bar are cropped out and passwords are masked.</p>
    </div>
    <div id="recording" class="hidden">
      <button id="pause">Pause</button>
      <button id="stop" class="primary">Stop and save</button>
    </div>
    <label class="opt"><input type="checkbox" id="alwaysMask" /> Always mask password fields</label>
    <div id="help" class="help hidden"></div>
    <script src="popup.js"></script>
  </body>
</html>
