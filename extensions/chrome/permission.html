<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Allow camera and microphone · Rekoto</title>
    <style>
      :root { --bg: #f1f1f3; --card: #fff; --text: #141414; --muted: #75757f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0c; --card: #161618; --text: #f4f4f5; --muted: #9a9aa3; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; }
      .card { width: min(440px, 92vw); padding: 32px; border-radius: 26px; background: var(--card); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.12); }
      .logo { position: relative; width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 15px; background: #141414; color: #ffc400; display: grid; place-items: center; font-weight: 800; font-size: 26px; }
      .logo i { position: absolute; right: 8px; bottom: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ffc400; }
      h1 { margin: 0 0 8px; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
      p { margin: 0 0 22px; color: var(--muted); }
      button { width: 100%; height: 52px; border: none; border-radius: 999px; background: #ffc400; color: #141414; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
      button:hover { background: #ffb300; }
      .msg { margin: 14px 0 0; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">R<i></i></div>
      <h1>Allow camera and microphone</h1>
      <p>So the Rekoto popup can show your camera preview and microphone level. Recording itself is done by the Rekoto desktop app.</p>
      <button id="allow">Allow</button>
      <p class="msg" id="msg"></p>
    </div>
    <script src="permission.js"></script>
  </body>
</html>
