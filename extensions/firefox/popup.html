<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><span class="logo"></span> Rekoto Recorder</header>
    <main>
      <div id="status" class="status">Connecting…</div>
      <div id="idle" class="actions hidden">
        <button id="start" class="primary"><span class="dot"></span> Record this window</button>
        <p class="hint">Uses your camera and microphone settings from the desktop app. Toolbars and bookmarks are cropped out, and password fields are masked.</p>
      </div>
      <div id="recording" class="actions hidden">
        <button id="stop" class="primary">Finish and save</button>
        <button id="pause">Pause</button>
      </div>
      <p id="help" class="help hidden"></p>
      <label class="opt"><input type="checkbox" id="alwaysMask" /> Always mask password fields</label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
