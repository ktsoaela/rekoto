appId: app.Rekoto.desktop
productName: Rekoto
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: native-host
    to: native-host
  - from: extensions
    to: extensions
artifactName: Rekoto-Setup.${ext}
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Rekoto
  uninstallDisplayName: Rekoto
  artifactName: Rekoto-Setup.${ext}
