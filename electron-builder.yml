appId: app.loomclone.desktop
productName: Loom Clone
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
extraResources:
  - from: native-host
    to: native-host
  - from: extensions
    to: extensions
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
